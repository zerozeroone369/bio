name: bio_mobile
description: "Bio Link Mobile App - Modern Profile with Live Video Background, Dynamic Rain & Snow Themes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  video_player: ^2.9.2
  file_picker: ^8.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  dio: ^5.7.0
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2
  ota_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
